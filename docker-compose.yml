services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rantaiasa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rantaiasa
    ports:
      - "5432:5432"
    volumes:
      - rantaiasa_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rantaiasa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rantaiasa_postgres:
